<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <div class="card">

            <div class="avatar">
                👨‍💻
            </div>

            <h1>{{ titulo }}</h1>

            <p>
                Bienvenido a mi primera aplicación web desarrollada con
                <strong>Python, Flask, HTML y CSS</strong>.
            </p>

            <div class="info">
                <p>🚀 Desarrollo Web</p>
                <p>🐍 Python Flask</p>
                <p>☁️ AWS EC2 & Docker</p>
            </div>

            <button onclick="mostrarMensaje()">
                Explorar Opciones
            </button>

            <div id="mensaje"></div>

        </div>
    </div>

    <script>
        function mostrarMensaje() {
            document.getElementById("mensaje").innerHTML =
                "<p style='margin-top:20px;color:#2563eb;font-weight:bold;'>¡Gracias por visitar mi página web! 🎉</p>";
        }
    </script>

</body>
</html>
