<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #2563eb, #38bdf8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #ffffff;
            width: 90%;
            max-width: 500px;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .avatar {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1e3a8a;
            font-size: 36px;
            margin-bottom: 15px;
        }

        p {
            color: #475569;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .tags {
            margin-bottom: 25px;
        }

        .tag {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 8px 14px;
            border-radius: 20px;
            margin: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-secondary {
            background: #0f172a;
            color: white;
        }

        .btn:hover {
            transform: scale(1.08);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">👨‍💻</div>

        <h1>{{ titulo }}</h1>

        <p>
            Bienvenido a mi página web creada con
            <strong>Python, Flask, HTML y CSS</strong>.
        </p>

        <div class="tags">
            <span class="tag">🐍 Python</span>
            <span class="tag">🔥 Flask</span>
            <span class="tag">🎨 CSS</span>
            <span class="tag">☁️ Docker EC2</span>
        </div>

        <div class="buttons">
            <a href="#" class="btn btn-primary">Explorar</a>
            <a href="#" class="btn btn-secondary">Contacto</a>
        </div>
    </div>

</body>
</html>
